# ============================================================
# LineWeb Docker Compose — 阿里云 ECS（Ubuntu）生产部署（**生产使用**）
#
# 线上现状：1Panel v2.3.2 + Docker Compose 部署，1Panel 负责安装 Docker/Compose
#   与外部网络 1panel-network，本文件是生产实际使用的编排文件。
#   - 应用：容器 lineweb-server-1（由本仓库根 Dockerfile 构建），端口 3001:3001，
#     restart: unless-stopped，compose 自带 /api/health 健康检查。
#   - 数据库：PostgreSQL 16 容器 lineweb-postgres（postgres:16-alpine，
#     数据卷 lineweb-pg-data，容器挂在 1panel-network 上），DATABASE_URL 指向
#     lineweb-postgres:5432；SQLite schema → PostgreSQL 的改写由
#     server/scripts/docker-entrypoint.sh 在容器启动时完成（db push + seed）。
#   - 该机器直连 Docker Hub 会超时，构建前需在 /etc/docker/daemon.json 配置
#     国内镜像加速（docker.1panel.live、docker.m.daocloud.io、docker.1ms.run）。
#
# 前置准备（ECS / Ubuntu，1Panel + 命令行均可）:
#   【网络】  1panel-network 由 1Panel 创建（本文件按 external 引用）
#   【数据库】PostgreSQL 16 容器 lineweb-postgres 已创建，数据库名 lineweb
#   【文件】  代码在 /opt/lineweb（该 ECS 无法直连 GitHub，更新走镜像或本地 push）
#
# 启动:
#   1. 在 /opt/lineweb/.env 写入 DATABASE_URL / JWT_SECRET / STORAGE_NODE_TOKEN 等
#   2. docker compose up -d --build
#   3. 验收：curl http://127.0.0.1:3001/api/health（期望 status=ok、db=connected）
#   4. 阿里云安全组放行 3001（面板口为 18080；当前只放行 22 与 18080，3001 待放行）
#
# 更新部署:
#   docker compose up -d --build
#
# 静态资源加速（可选）:
#   如果宿主机 Nginx 需要直连静态文件，取消注释 volumes 挂载
#   并在 nginx.conf 中配置 alias /opt/lineweb/client/dist/assets/
# ============================================================

services:
  server:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      STORAGE_NODE_TOKEN: ${STORAGE_NODE_TOKEN:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10240}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      # 聊天（XMPP · neko 独立主机）：令牌只写在服务器 .env，仓库内仅占位
      NEKO_CHAT_ENABLED: ${NEKO_CHAT_ENABLED:-false}
      NEKO_CHAT_INTERNAL_URL: ${NEKO_CHAT_INTERNAL_URL:-}
      NEKO_CHAT_TOKEN: ${NEKO_CHAT_TOKEN:-}
      NEKO_CHAT_WS_PATH: ${NEKO_CHAT_WS_PATH:-/xmpp-websocket}
      NEKO_CHAT_ACCOUNT_BASE: ${NEKO_CHAT_ACCOUNT_BASE:-1000000000000}
      NEKO_CHAT_USERNAME_PREFIX: ${NEKO_CHAT_USERNAME_PREFIX:-lw_}
      NEKO_CHAT_ALLOW_NATIVE: ${NEKO_CHAT_ALLOW_NATIVE:-true}
    networks:
      - default
      - 1panel
    restart: unless-stopped
    volumes:
      - lineweb-init:/var/lib/lineweb
    # 资源限制 — 防止容器耗尽宿主机资源
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    # 健康检查 — Docker 自动重启不健康容器
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', function(r) { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', function() { process.exit(1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # 日志限制 — 防止日志填满磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  1panel:
    # 由 1Panel 创建的外部网络，应用容器与 PostgreSQL 容器（lineweb-postgres）都在其中
    external: true
    name: 1panel-network

volumes:
  lineweb-init:
