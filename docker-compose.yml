# ============================================================
# LineWeb Docker Compose — 适配 1Panel / Ubuntu
#
# 前置准备（在 1Panel 面板操作）:
#   【数据库】→ PostgreSQL → 创建数据库 "lineweb"
#   【网站】→ 创建网站 → 反向代理 → 目标 URL: http://127.0.0.1:3001
#   【文件】→ 上传项目 → 或 git clone 到 /opt/lineweb
#
# 启动:
#   1. cp .env.docker .env  # 修改密码
#   2. docker compose up -d
#   3. 访问域名（1Panel 网站中配置的域名）
#
# 更新部署:
#   git pull && docker compose up -d --build
#
# 静态资源加速（可选）:
#   如果宿主机 Nginx 需要直连静态文件，取消注释 volumes 挂载
#   并在 nginx.conf 中配置 alias /opt/lineweb/client/dist/assets/
# ============================================================

services:
  server:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      PORT: ${PORT:-3001}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      STORAGE_NODE_TOKEN: ${STORAGE_NODE_TOKEN:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10240}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
    networks:
      - default
      - 1panel
    restart: unless-stopped
    # 资源限制 — 防止容器耗尽宿主机资源
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    # 健康检查 — Docker 自动重启不健康容器
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', function(r) { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', function() { process.exit(1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # 日志限制 — 防止日志填满磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  1panel:
    external: true
    name: 1panel-network
