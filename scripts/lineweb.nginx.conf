# LineWeb Nginx 配置
#
# 用途：**在 ECS（Ubuntu）上启用域名与 HTTPS 时使用**。
#   当前阶段是「HTTP + 公网 IP :3001 直连」，不需要 Nginx 反代；
#   配好域名/证书后再套用本文件。
#
# 使用方式（通用 Ubuntu + Nginx）：
#   把本文件放进 /etc/nginx/sites-available/（或 conf.d/），软链到 sites-enabled/，
#   改好 server_name 为你的域名，然后 `nginx -t && systemctl reload nginx`。
#   HTTPS 证书可用 certbot 申请；签发后再补一段 443 的 server 块。
#   宝塔面板是历史路径（旧宝塔部署），不再作为默认说明。
#
# WebSocket 支持存储节点连接，需要额外 proxy 配置

# HTTP (80端口)
server {
    listen 80;
    server_name _;  # 替换为你的域名或保持 _ 匹配所有

    # 上传文件大小限制
    client_max_body_size 100m;

    # WebSocket 支持 (存储节点连接 /ws/storage)
    location /ws/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Download 路径 — 大文件需要更长超时
    location ~ ^/api/drive/(download|files/.+/download) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 请求
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端静态文件 + SPA 回退由 Express 托管
    # 由于 Express 在生产模式下直接 serve client/dist/，
    # 所有非 /api 非 /ws 请求直接透传给 Express 处理
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
