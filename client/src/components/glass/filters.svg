<svg xmlns="http://www.w3.org/2000/svg" style="position:fixed;width:0;height:0;pointer-events:none">
  <defs>
    <!-- ============================================================
         Liquid Glass Core Filter — Standard (thin glass)
         Uses displacement map for edge refraction + blur + saturation
         Displacement map from liquid-glass-react (R=X, B=Y displacement)
         ============================================================ -->
    <filter id="lg-core" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <!-- Load displacement map for edge refraction -->
      <feImage id="lg-core-map" x="0" y="0" width="100%" height="100%" result="DISPLACEMENT_MAP"
        href="data:image/jpeg;base64,"
        preserveAspectRatio="xMidYMid slice" />
      <!-- Apply displacement for edge refraction -->
      <feDisplacementMap in="SourceGraphic" in2="DISPLACEMENT_MAP" scale="-45"
        xChannelSelector="R" yChannelSelector="B" result="displaced" />
      <!-- Subtle blur for depth -->
      <feGaussianBlur in="displaced" stdDeviation="1.7" result="blurred" />
    </filter>

    <!-- ============================================================
         Liquid Glass Strong — thicker glass, more refraction
         ============================================================ -->
    <filter id="lg-core-strong" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <!-- Same displacement map -->
      <feImage id="lg-core-strong-map" x="0" y="0" width="100%" height="100%" result="DISPLACEMENT_MAP"
        href="data:image/jpeg;base64,"
        preserveAspectRatio="xMidYMid slice" />
      <!-- Stronger displacement for thick glass -->
      <feDisplacementMap in="SourceGraphic" in2="DISPLACEMENT_MAP" scale="-80"
        xChannelSelector="R" yChannelSelector="B" result="displaced" />
      <!-- Slightly more blur for depth -->
      <feGaussianBlur in="displaced" stdDeviation="1.9" result="blurred" />
    </filter>

    <!-- ============================================================
         Specular highlight glow — light reflection on glass
         ============================================================ -->
    <filter id="lg-glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="glow" />
      <feComposite in="glow" in2="SourceGraphic" operator="in" />
    </filter>
  </defs>
</svg>
