<svg xmlns="http://www.w3.org/2000/svg" style="position:fixed;width:0;height:0;pointer-events:none">
  <defs>
    <!-- ============================================================
         Liquid Glass Core Filter
         Combines refraction (feDisplacementMap) + blur + glow
         ============================================================ -->
    <filter id="lg-core" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <!-- 1. Generate organic noise for liquid flow -->
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="42" result="noise" />
      <!-- 2. Soften into smooth waves -->
      <feGaussianBlur in="noise" stdDeviation="2" result="smooth-noise" />
      <!-- 3. Pixel displacement = refraction through glass -->
      <feDisplacementMap in="SourceGraphic" in2="smooth-noise" scale="45" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <!-- 4. Subtle blur for depth -->
      <feGaussianBlur in="displaced" stdDeviation="1.7" result="blurred" />
    </filter>

    <!-- ============================================================
         Liquid Glass Strong — thicker glass, more refraction
         ============================================================ -->
    <filter id="lg-core-strong" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="4" seed="42" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="3" result="smooth-noise" />
      <feDisplacementMap in="SourceGraphic" in2="smooth-noise" scale="80" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="1.9" result="blurred" />
    </filter>

    <!-- ============================================================
         Specular highlight glow — light reflection on glass
         ============================================================ -->
    <filter id="lg-glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="glow" />
      <feComposite in="glow" in2="SourceGraphic" operator="in" />
    </filter>

    <!-- ============================================================
         SDF-based edge refraction map
         Creates precise inward/outward lensing at glass edges
         Uses feMorphology + feComponentTransfer to calculate
         distance from edge
         ============================================================ -->
    <filter id="lg-edge-refraction" color-interpolation-filters="sRGB">
      <!-- Distance from edge -->
      <feMorphology operator="dilate" radius="20" in="SourceAlpha" result="dilated" />
      <feGaussianBlur in="dilated" stdDeviation="10" result="blurred-edge" />
      <!-- Invert = distance to nearest edge -->
      <feComponentTransfer in="blurred-edge" result="edge-dist">
        <feFuncA type="linear" slope="1" intercept="0" />
      </feComponentTransfer>
      <!-- Displacement based on edge distance -->
      <feDisplacementMap in="SourceGraphic" in2="edge-dist" scale="-30" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>
