# ============================================================
# LineWeb Nginx 反向代理配置（Docker / 1Panel 共用）
# 处理:
#   - 静态资源直连（/assets/ → 不经过 Express）
#   - 反向代理 → server:3001
#   - WebSocket 升级（/ws/ 路径）
#   - 大文件上传（100MB）
#   - Brotli + Gzip 压缩
# ============================================================

upstream lineweb_server {
    server server:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 大文件上传支持（网盘功能）
    client_max_body_size 100m;

    # ============================================================
    # Brotli 压缩（优先，比 Gzip 小 20-30%）
    # 如果 nginx 未编译 brotli 模块，注释掉此块即可
    # ============================================================
    brotli on;
    brotli_types text/plain text/css application/json application/javascript
                 text/xml application/xml text/javascript image/svg+xml
                 font/woff2 font/ttf application/wasm;
    brotli_comp_level 6;
    brotli_min_length 256;

    # ============================================================
    # Gzip 压缩（Brotli 不支持的浏览器回退）
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml
               font/woff2 font/ttf application/wasm;
    gzip_min_length 256;
    gzip_comp_level 5;

    # ============================================================
    # 静态资源 — Nginx 直连，不经过 Express
    # 需要 docker-compose.yml 将 client/dist 挂载为 volume
    # 如果使用 1Panel 外部 Nginx，将 alias 路径改为宿主机绝对路径
    # ============================================================
    location /assets/ {
        alias /app/client/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        # 仅允许 GET/HEAD
        limit_except GET HEAD { deny all; }
    }

    # ---- WebSocket 路径（存储节点通信） ----
    location /ws/ {
        proxy_pass http://lineweb_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # WebSocket 长连接
        proxy_send_timeout 86400s;
    }

    # ---- 所有其他请求（API + SPA fallback） ----
    location / {
        proxy_pass http://lineweb_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
