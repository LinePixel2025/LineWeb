name: Deploy to Server

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/Lineweb

            echo "=== [1/6] 拉取最新代码（带重试） ==="
            # 降低 HTTP/2 优先级以缓解 SSL 超时问题
            git config --global http.version HTTP/1.1
            for i in 1 2 3; do
              echo "尝试 #$i: git fetch origin master"
              git fetch origin master && break
              [ $i -eq 3 ] && exit 1
              echo "拉取失败，等待 10 秒后重试..."
              sleep 10
            done
            git reset --hard origin/master
            echo "当前 HEAD: $(git log --oneline -1)"

            echo "=== [2/6] 强制完整重建（先构建，不中断服务） ==="
            docker compose build --no-cache --pull
            echo "✅ 构建成功"

            echo "=== [3/6] 停止旧容器 ==="
            docker compose down

            echo "=== [4/6] 启动新容器 ==="
            docker compose up -d --force-recreate

            echo "=== [5/6] 刷新 Nginx 缓存并等待健康检查 ==="
            sleep 5
            # 重启 Nginx 以清除 1Panel/OpenResty 的静态资源缓存
            docker restart 1Panel-openresty 2>/dev/null || nginx -s reload 2>/dev/null || echo "(nginx reload skipped)"
            sleep 3
            docker compose ps
            docker compose logs --tail=10

            echo "=== [6/6] 部署验证 ==="
            CONTAINER=$(docker compose ps -q server)
            echo "容器客户端构建文件:"
            docker exec $CONTAINER sh -c 'ls /app/client/dist/assets/PostPage-*.js 2>/dev/null || echo "  (no PostPage chunk)"'
            docker exec $CONTAINER sh -c 'ls /app/client/dist/assets/index-*.js 2>/dev/null || echo "  (no index chunk)"'
            echo "健康检查:"
            curl -s http://localhost:3001/api/health || echo "  (health check failed)"

            echo "=== 部署成功 ==="

            echo "=== [7/6] 精准清理旧镜像/缓存（保留 24h 内构建缓存） ==="
            docker image prune -f --filter "until=24h"
            docker builder prune -f --filter "until=24h"

            echo "=== ✅ 部署完成 ==="
